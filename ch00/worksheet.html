<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:900px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}

  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}

  .q .p{margin:4px 0 10px;font-size:15px}

  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0 10px;font-size:14px;white-space:pre;overflow-x:auto}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px;font-family:inherit}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt:disabled{cursor:default;opacity:.9}
  .fb{margin-top:8px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}

  .hint{color:var(--dim);font-size:13px}
  details{color:var(--dim);font-size:13px}

  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}

  .dg td.r{font-family:var(--mono)}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
  @media (max-width:600px){ .app{ padding:14px 10px 30px; } .q pre.qc{ font-size:12.5px; } }
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const Q=[{"t": "0.1 · 과정 소개", "anim": "C0-1 Process 단면도로 보는 8 Chapter", "qs": [{"p": "이 과정이 기존 Linux System Programming 과정과 가장 크게 다른 점은 무엇입니까?", "o": ["API 사용법이 아니라 System Call 아래에서 왜 그렇게 동작하는지를 도구로 관찰해 확인한다", "기존 과정의 File I/O, Process, Pthread, IPC 를 처음부터 다시 자세히 가르친다", "C 대신 Rust 로 모든 실습을 진행한다", "Kernel Module 을 직접 작성해 Kernel 을 수정하는 것이 중심이다"], "a": 0, "w": "질문이 \"어떻게 사용하는가\" 에서 \"왜 이렇게 동작하는가\" 로 바뀌고, 설명을 듣는 데서 끝내지 않고 strace, /proc, perf, ftrace, bpftrace 로 직접 확인합니다. 기존 과정 내용은 3~5분 복습만 합니다.", "an": "0.1-3 표"}, {"p": "이 과정의 핵심 키워드 순서로 알맞은 것은 무엇입니까?", "o": ["Observe → Understand → Implement → Analyze", "Implement → Test → Deploy → Monitor", "Understand → Memorize → Implement → Review", "Read → Write → Compile → Run"], "a": 0, "w": "관찰하고, 이해하고, 구현하고, 다시 도구로 분석합니다. Final Project(L40)도 마지막에 strace·perf·ftrace·bpftrace 로 분석하는 것으로 끝납니다.", "an": "0.1 첫 줄"}, {"p": "<code>write()<\/code> 가 len 을 return 한 직후 전원이 꺼지면 Data 가 Disk 에 남는가? 이 질문의 답을 찾게 되는 Chapter 는 어디입니까?", "o": ["Chapter 8 · Isolation, Security", "Chapter 5 · Event Driven Programming", "Chapter 1 · 프로그램 실행과 System Call", "Chapter 3 · Page Cache 와 Advanced File I/O"], "a": 3, "w": "write 는 Page Cache 에 쓰고 return 합니다. Disk 기록은 Writeback 이 나중에 하며, 그 사이를 보장하는 것이 fsync 입니다(L15).", "an": "0.1-2 표"}, {"p": "<code>malloc(1GB)<\/code> 직후 top 의 Memory 사용량이 거의 늘지 않는 이유를 다루는 Lecture 는 무엇입니까?", "o": ["L33 perf 를 이용한 Performance 분석", "L09 Page Fault 내부 동작", "L19 Futex 내부 구조", "L23 epoll 내부 구조"], "a": 1, "w": "malloc 은 가상 주소만 예약하고, 실제 Physical Page 는 처음 쓰는 순간 Page Fault 로 할당됩니다. Chapter 2 L09 에서 다룹니다.", "an": "0.1-2 표"}, {"p": "8 Chapter 중 특정 층이 아니라 \"모든 층을 들여다보는 도구\" 를 다루는 Chapter 는 무엇입니까?", "o": ["Chapter 2 · Virtual Memory", "Chapter 6 · io_uring", "Chapter 4 · Thread Synchronization", "Chapter 7 · Debugging, Tracing, Performance"], "a": 3, "w": "Chapter 1~6 은 Process 단면도의 특정 층을 파고들고, Chapter 7 은 층이 아니라 /proc, strace, perf, ftrace, eBPF 같은 관찰 도구, Chapter 8 은 Process 바깥의 울타리입니다.", "an": "C0-1 7단계"}, {"p": "Chapter 8 (Isolation, Security) 의 성격으로 알맞은 것은 무엇입니까?", "o": ["Process 를 둘러싼 울타리: 보이는 것, 쓸 수 있는 양, 특권, System Call 을 제한한다", "Disk 암호화와 File System 권한만 다룬다", "Kernel 안의 Scheduler 알고리즘을 바꾸는 방법을 다룬다", "Network 방화벽과 TLS 를 다룬다"], "a": 0, "w": "Namespace(보이는 것), Cgroup(쓰는 양), Capability(특권), seccomp(System Call) 네 가지가 Container 의 구성 요소이고 Chapter 8 의 주제입니다.", "an": "C0-1 8단계"}, {"p": "이 과정에서 다루지 <b>않는<\/b> 것은 무엇입니까?", "o": ["io_uring 의 Submission Queue 와 Completion Queue", "epoll 의 Ready List 와 Edge Trigger", "socket · bind · listen · accept 를 이용한 TCP Server", "seccomp 를 이용한 System Call 제한"], "a": 2, "w": "Network Programming 전체는 별도 과정 Linux Network System Programming 에서 다룹니다. epoll 은 Network API 가 아니라 범용 FD 대기 메커니즘으로 다룹니다.", "an": "0.1-5"}, {"p": "epoll 실습에서 socket 대신 사용하는 FD 로 알맞지 <b>않은<\/b> 것은 무엇입니까?", "o": ["timerfd", "TCP socket", "pipe", "eventfd"], "a": 1, "w": "이 과정의 epoll 실습은 pipe, FIFO, eventfd, timerfd, signalfd, inotify 를 사용합니다. Network Socket 은 쓰지 않습니다.", "an": "0.1-5 코드 블록"}, {"p": "Lecture 한 편의 진행 흐름으로 알맞은 것은 무엇입니까?", "o": ["API 목록 → 함수 Prototype 암기 → 시험", "Slide 설명만 → 정리", "문제 상황 → 핵심 개념 → Animation → C Source → 실행 → Tool 로 관찰 → 정리", "Kernel Source 전체 읽기 → 요약"], "a": 2, "w": "설명 → 시각화 → 코드 → 실행 → 관찰 → 분석의 흐름입니다. 화면도 3~5분마다 PPT, Animation, Code, Terminal 로 바뀝니다.", "an": "0.1-6"}, {"p": "선수 지식 점검에서 설명하지 못하는 항목이 3개 이상이면 어떻게 하는 것이 권장됩니까?", "o": ["Chapter 7 부터 시작한다", "무시하고 진행한다. 이 과정에서 처음부터 다시 가르친다", "이 과정의 Chapter 1 을 두 번 본다", "기존 과정의 해당 Section 을 먼저 복습한다"], "a": 3, "w": "이 과정은 File I/O, Process, Pthread, IPC 를 다시 가르치지 않습니다. 관련 위치: File I/O 2.2~2.3, Process 3.1~3.2, Pthread 4.2~4.3, IPC 5.2 와 5.5.", "an": "0.1-1 TIP"}]}, {"t": "0.2 · 실습 환경 준비", "anim": "C0-2 환경 점검 시뮬레이터", "qs": [{"p": "이 과정의 기준 실습 환경으로 알맞은 것은 무엇입니까?", "o": ["Ubuntu Desktop 22.04 · Kernel 5.15 · GCC 11", "CentOS 7 · Kernel 3.10 · GCC 4.8", "Ubuntu Server 26.04 LTS · Linux Kernel 7.0 · GCC 15", "WSL2 Ubuntu · Kernel 5.10 · Clang"], "a": 2, "w": "VirtualBox 7.2.8 이상 위의 Ubuntu Server 26.04 LTS(Kernel 7.0, GCC 15)입니다. Server ISO 를 쓰는 이유는 모든 실습을 SSH Terminal 에서 하고 Memory 를 적게 쓰기 때문입니다.", "an": "0.2 실습 환경 기준"}, {"p": "VM 의 Processor 를 1개로 두면 재현되지 않는 실습은 무엇입니까?", "o": ["Chapter 1 의 strace 출력", "Chapter 0 의 env_check.sh 실행", "Chapter 4 의 Race Condition, Memory Ordering, False Sharing", "Chapter 3 의 Page Cache Hit"], "a": 2, "w": "CPU 가 1개이면 두 Thread 가 실제로 동시에 실행되지 않으므로 경쟁 상황이 거의 일어나지 않습니다. env_check.sh 는 CPU 1개를 FAIL 로 표시합니다.", "an": "0.2-2 IMPORTANT · C0-2"}, {"p": "NAT + Port Forwarding 환경에서 PuTTY 의 Host Name 과 Port 로 알맞은 것은 무엇입니까?", "o": ["10.0.2.15 와 2222", "127.0.0.1 과 2222", "127.0.0.1 과 22", "10.0.2.15 와 22"], "a": 1, "w": "VM 은 NAT 뒤에 있어 10.0.2.15 로 직접 접속할 수 없습니다. Port Forwarding 규칙이 Windows 의 127.0.0.1:2222 를 VM 의 22번 Port 로 넘겨 줍니다.", "an": "0.2-2 · 0.2-4"}, {"p": "Ubuntu Server 설치 중 반드시 선택해야 하는 것은 무엇입니까? 빠뜨리면 PuTTY 로 접속할 수 없습니다.", "o": ["Minimized install", "Ubuntu Pro 등록", "Featured snaps 의 docker", "Install OpenSSH server"], "a": 3, "w": "SSH 서버가 없으면 접속할 수 없습니다. 빠뜨렸다면 VM 화면에서 직접 Login 해 sudo apt install -y openssh-server 를 실행합니다.", "an": "0.2-3 WARNING"}, {"p": "실습을 <code>/tmp<\/code> 가 아니라 Home Directory 아래에서 해야 하는 이유는 무엇입니까?", "o": ["/tmp 는 root 만 쓸 수 있기 때문", "/tmp 는 Network 로 공유되기 때문", "Ubuntu 26.04 의 /tmp 는 Memory 위의 tmpfs 라서 Page Cache · Writeback · fsync 결과가 강의와 다르게 나오기 때문", "/tmp 의 File 은 실행 권한을 줄 수 없기 때문"], "a": 2, "w": "tmpfs 는 Disk 가 아니라 Memory 이므로 Disk I/O 와 Writeback 이 일어나지 않습니다. Chapter 3 의 File I/O 실습 결과가 완전히 달라집니다.", "an": "0.2-5 IMPORTANT"}, {"p": "<code>linux-tools-$(uname -r)<\/code> 처럼 perf 패키지 이름에 <code>$(uname -r)<\/code> 를 붙이는 이유는 무엇입니까?", "o": ["perf 는 실행 중인 Kernel 과 Version 이 맞아야 동작하기 때문", "root 권한 없이 설치하기 위해서", "32bit 와 64bit 를 모두 받기 위해서", "가장 최신 perf 를 자동으로 받기 위해서"], "a": 0, "w": "$( ) 는 명령 치환이라 현재 Kernel Release(예: 7.0.0-14-generic)가 그 자리에 들어갑니다. Kernel 이 Update 되면 install_tools.sh 를 다시 실행합니다.", "an": "0.2-6 NOTE"}, {"p": "VirtualBox 에서 env_check.sh 가 \"Hardware Counter 사용 불가 (cycles, cache-misses)\" 를 WARN 으로 표시했습니다. 올바른 대응은 무엇입니까?", "o": ["Processor 를 4개로 늘리면 해결된다", "sudo 로 실행하면 해결된다", "VM 을 지우고 Ubuntu 를 다시 설치한다", "정상이다. VirtualBox 는 PMU 를 노출하지 않으므로 Software Event 로 실습하고 HW Counter 장면은 강의 화면을 참고한다"], "a": 3, "w": "page-faults, context-switches 같은 Software Event 는 Kernel 이 세므로 VirtualBox 에서도 됩니다. cycles, cache-misses 는 CPU 의 PMU 가 세는데 VirtualBox 는 이를 VM 에 보여 주지 않습니다.", "an": "0.2-7 · C0-2"}, {"p": "<code>env_check.sh<\/code> 를 <code>sudo<\/code> 로 한 번 더 실행해야 점검되는 항목은 무엇입니까?", "o": ["ftrace 의 available_tracers 와 bpftrace Program 실행", "Ubuntu Version", "gcc 와 make 의 설치 여부", "CPU 개수와 Memory 크기"], "a": 0, "w": "tracefs 의 available_tracers 를 읽고 bpftrace Program 을 실제로 실행하려면 root 권한이 필요합니다. 결과에서 FAIL 이 0개이면 준비가 끝난 것입니다.", "an": "0.2-7"}, {"p": "<code>hello_trace<\/code> 를 관찰할 때 strace 에는 보이지 않고 ltrace 에만 보이는 것은 무엇입니까?", "o": ["exit_group(0)", "malloc 과 memset", "write(1, &quot;hello, kernel\\n&quot;, 14)", "page-faults 횟수"], "a": 1, "w": "malloc, memset 은 System Call 이 아니라 Library 함수라서 ltrace 에만 보입니다. write 는 System Call 이라 strace 와 bpftrace 에 보이고, page-faults 는 perf stat 이 셉니다.", "an": "0.2-8"}, {"p": "<code>perf stat -e page-faults ./hello_trace<\/code> 결과가 256 보다 큰 이유로 알맞은 것은 무엇입니까?", "o": ["VirtualBox 가 Page Fault 를 두 배로 세기 때문", "memset 이 256 Page 를 처음 건드릴 때마다 Page Fault 가 나고, 프로그램을 Memory 에 올리는 과정에서도 Page Fault 가 나기 때문", "perf 가 자기 자신의 Page Fault 도 세기 때문", "write 한 번마다 Page Fault 가 나기 때문"], "a": 1, "w": "malloc 은 주소만 예약하고, Page 를 처음 쓰는 순간 Page Fault 로 Physical Page 가 할당됩니다. 나머지는 ELF 와 Library 를 올리는 과정의 Fault 입니다(Chapter 1 L05, Chapter 2 L09).", "an": "0.2-8-4"}]}];
let tab=0;const ans=Q.map(s=>s.qs.map(()=>null));const graded=Q.map(()=>false);
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(16).padStart(8,'0').slice(-4);}
function codeFor(name,t,score){return `${t}${'ABCDEFGHIJK'[10-score]||'K'}-${hash(`${name.trim()}|${t}|${score}|lsp2-ch00`)}`;}
function scoreOf(i){return ans[i].filter((a,k)=>a===Q[i].qs[k].a).length;}
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent;}
function renderTabs(){$('#tabs').innerHTML=Q.map((s,i)=>{const n=ans[i].filter(a=>a!==null).length;return `<button class="${i===tab?'active':''} ${graded[i]?'graded':''}" data-i="${i}">0.${i+1}<span class="s">${graded[i]?scoreOf(i)+'/10':n+'/10'}</span></button>`;}).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=+b.dataset.i;render();window.scrollTo({top:0});});}
function render(){renderTabs();const s=Q[tab];const g=graded[tab];
  $('#sheet').innerHTML=`<div class="head"><span class="t">${s.t}</span><span class="a">🎬 ${s.anim}</span></div>`+s.qs.map((q,k)=>{const a=ans[tab][k];
    return `<div class="q ${g&&a===null?'unans':''}"><div class="n">문항 ${k+1}</div><div class="p">${q.p}</div>${q.c?`<pre class="qc">${q.c}</pre>`:``}<div class="opts">${q.o.map((o,j)=>{let cls='';if(g){if(j===q.a)cls='ok';else if(j===a)cls='bad';}else if(j===a)cls='sel';return `<button class="opt ${cls}" data-k="${k}" data-j="${j}" ${g?'disabled':''}>${'①②③④'[j]} ${o}</button>`;}).join('')}</div>${g?`<div class="fb ${a===q.a?'ok':'bad'}">${a===null?'미응답. ':(a===q.a?'정답. ':'오답. ')}${q.w}<span class="anim">확인: ${q.an}</span></div>`:''}</div>`;}).join('');
  $('#sheet').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,j=+b.dataset.j;ans[tab][k]=(ans[tab][k]===j?null:j);render();});
  $('#gradeBtn').disabled=g;$('#gradeBtn').textContent=g?'채점 완료':'채점하기';
  const nm=$('#name').value;
  if(g){const sc=scoreOf(tab);$('#rscore').textContent=`${sc}/10`;if(nm.trim()){$('#rcode').textContent=codeFor(nm,tab+1,sc);$('#rhint').textContent='결과 코드';}else{$('#rcode').textContent='—';$('#rhint').textContent='이름을 입력하면 결과 코드가 나옵니다.';}}
  else{$('#rcode').textContent='—';$('#rscore').textContent='';const n=ans[tab].filter(a=>a!==null).length;$('#rhint').textContent=`0.${tab+1}: ${n}/10 골랐습니다. 채점하기를 누르면 잠깁니다.`;}
}
$('#gradeBtn').onclick=()=>{const n=ans[tab].filter(a=>a!==null).length;if(n<10&&!confirm(`아직 ${10-n}문항을 고르지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`))return;graded[tab]=true;render();};
$('#name').addEventListener('input',render);

/* ── 제출 대화상자 ── */
let lastHtml='',lastText='';
function buildReport(){
  const nm=$('#name').value.trim()||'(이름 없음)';const ds=new Date().toLocaleString('ko-KR');
  let h=`<h3>LSP2 Chapter 0 개념 워크시트 — 오답 정리</h3><div class="meta">${nm} · ${ds}</div>`;
  let t=`LSP2 Chapter 0 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let any=false;
  Q.forEach((s,i)=>{if(!graded[i])return;
    const wrong=s.qs.map((q,k)=>({q,k,a:ans[i][k]})).filter(x=>x.a!==x.q.a);
    h+=`<div class="sec">${s.t}</div>`;t+=`### ${s.t}\n`;
    if(!wrong.length){h+=`<div class="ok" style="margin:4px 0 8px">오답 없음</div>`;t+=`오답 없음\n\n`;return;}
    any=true;
    h+=`<table><tr><th>#</th><th>문항</th><th>내 답</th><th>정답</th></tr>`;t+=`| # | 문항 | 내 답 | 정답 |\n|---|---|---|---|\n`;
    wrong.forEach(({q,k,a})=>{const my=a===null?'미응답':'①②③④'[a]+' '+strip(q.o[a]);const co='①②③④'[q.a]+' '+strip(q.o[q.a]);const qt=strip(q.p).replace(/\s+/g,' ').slice(0,70);
      h+=`<tr><td class="r">${k+1}</td><td>${qt}</td><td class="bad">${my}</td><td class="ok">${co}</td></tr>`;
      t+=`| ${k+1} | ${qt.replace(/\|/g,'/')} | ${my.replace(/\|/g,'/')} | ${co.replace(/\|/g,'/')} |\n`;});
    h+=`</table>`;t+=`\n`;});
  const notGraded=Q.map((s,i)=>graded[i]?null:i+1).filter(x=>x);
  if(notGraded.length){h+=`<div class="meta" style="margin-top:10px">미채점: 0.${notGraded.join(', 0.')}</div>`;t+=`미채점: 0.${notGraded.join(', 0.')}\n`;}
  lastHtml=h;lastText=t;return h;
}
$('#submitBtn').onclick=()=>{if(!graded.some(x=>x)){alert('먼저 한 Unit 이상 채점하기를 눌러 주세요.');return;}$('#dgBody').innerHTML=buildReport();$('#toast').textContent='';$('#dlg').showModal();};
$('#closeBtn').onclick=()=>$('#dlg').close();
function copyRich(html,text){
  // 1) copy 이벤트에 두 형식을 직접 실어 보내기 (사용자 클릭 안에서 동기 실행 — file:// 에서도 동작)
  let done=false;
  const onCopy=e=>{e.clipboardData.setData('text/html',html);e.clipboardData.setData('text/plain',text);e.preventDefault();done=true;};
  document.addEventListener('copy',onCopy);
  try{
    const body=$('#dgBody');const sel=window.getSelection();const range=document.createRange();range.selectNodeContents(body);sel.removeAllRanges();sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
  }catch(e){}
  document.removeEventListener('copy',onCopy);
  return done;
}
$('#captureBtn').onclick=async()=>{
  const htmlDoc=`<meta charset="utf-8">`+lastHtml.replace(/ class="[^"]*"/g,'').replace(/<table>/g,'<table border="1" style="border-collapse:collapse">');
  if(copyRich(htmlDoc,lastText)){$('#toast').textContent='복사됨 — 노션 페이지에서 Ctrl+V 로 붙여 넣으세요.';return;}
  // 2) 비동기 Clipboard API
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([htmlDoc],{type:'text/html'}),'text/plain':new Blob([lastText],{type:'text/plain'})})]);
    }else{await navigator.clipboard.writeText(lastText);}
    $('#toast').textContent='복사됨 — 노션 페이지에서 Ctrl+V 로 붙여 넣으세요.';return;
  }catch(e){}
  // 3) 최종: 텍스트 영역 선택 복사
  try{
    const ta=document.createElement('textarea');ta.value=lastText;ta.style.position='fixed';ta.style.opacity='0';$('#dlg').appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand('copy');ta.remove();
    $('#toast').textContent=ok?'텍스트(마크다운 표)로 복사됨 — 노션에서 Ctrl+V.':'복사 실패 — 대화상자 내용을 드래그해 Ctrl+C 로 복사하세요.';
  }catch(e){$('#toast').textContent='복사 실패 — 대화상자 내용을 드래그해 Ctrl+C 로 복사하세요.';}
};
render();
